<div class="signup-page">

    <div class="signup-container">

        <!-- Left Side -->
        <div class="signup-brand">

            <div class="brand-icon">
                🚆
            </div>

            <h1>RailBook</h1>

            <p>
                Start your journey with
                simple and secure train booking.
            </p>

            <div class="train-decoration">
                🚆 ───────────── 🚉
            </div>

        </div>


        <!-- Signup Card -->
        <div class="signup-card">

            <div class="signup-header">

                <h2>Create Account</h2>

                <p>
                    Register to book your train tickets
                </p>

            </div>


            <form id="signupForm">

                <!-- Name -->

                <div class="form-group">

                    <label for="signupName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="signupEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="signupPassword">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="Create password"
                            required
                        >

                        <button
                            type="button"
                            id="toggleSignupPassword"
                            class="password-toggle"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <div
                    id="signupMessage"
                    class="message"
                ></div>


                <button
                    type="submit"
                    class="signup-btn"
                >
                    Create Account
                </button>

            </form>


            <div class="login-link">

                <span>
                    Already have an account?
                </span>

                <button
                    type="button"
                    id="goToLogin"
                >
                    Login
                </button>

            </div>

        </div>

    </div>

</div>
